[project]
name = "hackaton-meca-backend"
version = "0.1.0"
description = "Backend para Control Presupuestario - Enseña por Bolivia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "fastapi-mail>=1.6.8",
    "fastapi-pagination>=0.16.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "qrcode>=8.2",
    "redis>=8.1.0",
    "rsa>=4.9.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

