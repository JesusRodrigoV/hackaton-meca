<header class="topbar">
  <!-- Izquierda: Contexto de Trabajo -->
  <div class="topbar-left">
    <div class="gestion-selector">
      <span class="label">Año fiscal:</span>
      <select [value]="auth.currentGestion()" (change)="onGestionChange($event)" class="select-clean">
        @for (year of auth.availableGestiones(); track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </div>

    <!-- Jurisdicción / Alcance de datos -->
    <div class="scope-badge" [class.scoped]="auth.currentUser()?.scopeType !== 'global'">
      <app-icon name="map-pin" size="xs" [color]="auth.currentUser()?.scopeType !== 'global' ? 'var(--forest-green)' : '#718096'"></app-icon>
      <span>{{ auth.scopeBadge() }}</span>
    </div>
  </div>

  <!-- Derecha: Selector de Rol de Acceso -->
  <div class="topbar-right">
    <div class="role-switcher">
      <label class="switcher-label">
        <app-icon name="user-check" size="xs" color="var(--forest-green)"></app-icon>
        <span>Ver como:</span>
      </label>
      <select [value]="auth.currentUser()?.roleCode ?? 'ADMIN'" (change)="onRoleChange($event)" class="role-select">
        <option value="ADMIN">Director General (Admin)</option>
        <option value="FINANCE">Contador (Finanzas)</option>
        <option value="COORDINATOR">Coordinador Santa Cruz</option>
        <option value="AUDITOR">Auditor CATALYST</option>
      </select>
    </div>
  </div>
</header>
