<header class="topbar">
  <!-- Izquierda: Contexto de Trabajo -->
  <div class="topbar-left">
    <div class="gestion-selector">
      <span class="label">Año fiscal:</span>
      <select [value]="auth.currentGestion()" (change)="onGestionChange($event)" class="select-clean">
        @for (year of auth.availableGestiones(); track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </div>

    <!-- Jurisdicción / Alcance de datos -->
    <div class="scope-badge" [class.scoped]="auth.currentUser()?.scopeType !== 'global'">
      <app-icon name="map-pin" size="xs" [color]="auth.currentUser()?.scopeType !== 'global' ? 'var(--forest-green)' : '#718096'"></app-icon>
      <span>{{ auth.scopeBadge() }}</span>
    </div>
  </div>

  <!-- Derecha: Perfil de Usuario y Cierre de Sesión -->
  <div class="topbar-right">
    <div class="user-profile-badge">
      <div class="user-avatar">{{ (auth.currentUser()?.fullName ?? 'U').substring(0, 2).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ auth.currentUser()?.fullName ?? 'Usuario' }}</span>
        <span class="user-role">{{ auth.userRole() }}</span>
      </div>
    </div>

    <!-- Botón para cerrar sesión -->
    <button type="button" class="btn-logout" (click)="onLogout()" title="Cerrar sesión institucional">
      <app-icon name="log-out" size="xs" color="#e11d48"></app-icon>
      <span class="logout-text">Salir</span>
    </button>
  </div>
</header>
