<aside class="sidebar">
  <!-- Header con Logo Institucional Oficial -->
  <div class="sidebar-header">
    <div class="brand">
      <img
        src="logos/logo-ensena-nuevo-01-311.webp"
        alt="Enseña por Bolivia"
        class="brand-image"
      />
    </div>
  </div>

  <!-- Navegación Dinámica -->
  <nav class="sidebar-nav">
    @for (section of sections; track section.title) {
      <div class="nav-group">
        <div class="group-title">{{ section.title }}</div>
        <ul class="nav-list">
          @for (item of section.items; track item.route) {
            <li *appHasPermission="item.permission ?? null">
              <a
                [routerLink]="item.route"
                routerLinkActive="active"
                class="nav-link"
              >
                <span class="link-icon">
                  <app-icon [name]="item.icon" size="sm"></app-icon>
                </span>
                <span class="link-label">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <!-- Footer con Perfil y Rol Activo -->
  <div class="sidebar-footer">
    <div class="user-pill">
      <div class="avatar">
        {{ auth.currentUser().fullName.charAt(0) }}
      </div>
      <div class="user-info">
        <div class="user-name">{{ auth.currentUser().fullName }}</div>
        <div class="user-role">{{ auth.currentUser().roleName }}</div>
      </div>
    </div>
  </div>
</aside>
