<div class="login-container">
  <div class="login-card">
    <!-- Header Institucional -->
    <div class="login-header">
      <img src="logos/logo-ensena-nuevo-01-311.webp" alt="Enseña por Bolivia" class="brand-logo" />
      <h1 class="system-title">Control Presupuestario y Ejecución</h1>
      <p class="system-subtitle">Plataforma Institucional de Gobernanza Financiera y Auditoría</p>
    </div>

    <!-- Formulario de Acceso -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Institucional</label>
        <div class="input-wrapper">
          <app-icon name="envelope" size="20px" color="#718096"></app-icon>
          <input
            id="email"
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="usuario@ensenaporbolivia.org"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <app-icon name="lock-alt" size="20px" color="#718096"></app-icon>
          <input
            id="password"
            type="password"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="••••••••••••"
            required
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="alert-error">
          <app-icon name="error-circle" size="18px" color="#b24c63"></app-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span>Verificando credenciales...</span>
        } @else {
          <app-icon name="log-in" size="20px" color="#ffffff"></app-icon>
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <!-- Roles Demo para Hackatón / Evaluación -->
    <div class="demo-section">
      <div class="demo-divider">
        <span>O ACCEDE DIRECTAMENTE CON PERFIL DEMO (RBAC)</span>
      </div>

      <div class="demo-grid">
        @for (demo of demoRoles; track demo.key) {
          <button type="button" class="demo-card" (click)="loginAsDemo(demo.key)">
            <div class="demo-icon" [style.background-color]="demo.color + '1a'">
              <app-icon [name]="demo.icon" size="22px" [color]="demo.color"></app-icon>
            </div>
            <div class="demo-info">
              <span class="demo-name">{{ demo.name }}</span>
              <span class="demo-role">{{ demo.role }}</span>
              <span class="demo-scope">{{ demo.scope }}</span>
            </div>
          </button>
        }
      </div>
    </div>

    <!-- Footer de Compliance -->
    <div class="login-footer">
      <span>Gestión Fiscal 2026 • Cifrado SHA-256 • Enseña por Bolivia</span>
    </div>
  </div>
</div>
