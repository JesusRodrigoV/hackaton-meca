<div class="login-container">
  <div class="login-card">
    <!-- Header Institucional -->
    <div class="login-header">
      <img src="logos/logo-ensena-nuevo-01-311.webp" alt="Enseña por Bolivia" class="brand-logo" />
      <h1 class="system-title">Gestión Presupuestaria</h1>
      <p class="system-subtitle">Ingresa con tu cuenta institucional para continuar</p>
    </div>

    <!-- Formulario de Acceso -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <app-icon name="envelope" size="20px" color="#718096"></app-icon>
          <input
            id="email"
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="usuario@ensenaporbolivia.org"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <app-icon name="lock-alt" size="20px" color="#718096"></app-icon>
          <input
            id="password"
            type="password"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="••••••••••••"
            required
          />
        </div>
      </div>

      @if (errorMessage()) {
        <div class="alert-error">
          <app-icon name="error-circle" size="18px" color="#e11d48"></app-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span>Ingresando...</span>
        } @else {
          <app-icon name="log-in" size="20px" color="#ffffff"></app-icon>
          <span>Iniciar sesión</span>
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <span>Enseña por Bolivia — Gestión 2026</span>
    </div>
  </div>
</div>
